<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem vinda a Layla Nail Design</title>
    <link rel="stylesheet" href="/css/style-login.css">
</head>
<body>

    <h1 style="text-align: center; margin-top: 20px;">Seja bem vinda!</h1>

    <div id="loginContainer">
        <!-- Formulário de Login -->
        <form id="loginForm">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <button type="submit">Entrar</button>
        </form>
        
        <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>

    <script>
        // Lógica de Login
        async function login() {
            const cpf = document.getElementById('cpf').value;
            const senha = document.getElementById('senha').value;
    
            try {
                const response = await fetch(`https://nailsite.onrender.com/usuario/${cpf}`);
                if (!response.ok) {
                    throw new Error('Usuário não encontrado');
                }
    
                const usuario = await response.json();
    
                if (usuario && usuario.senha === senha) {
                    localStorage.setItem("usuarioLogado", JSON.stringify(usuario));
    
                    if (usuario.tipo === 'admin') {
                        window.location.href = "painel.html";
                    } else {
                        window.location.href = "servicos.html";
                    }
    
                } else {
                    alert("CPF ou senha incorretos.");
                }
            } catch (error) {
                console.error('Erro ao logar:', error);
                alert('Erro ao fazer login. Tente novamente.');
            }
        }
    
        // Chamar função login ao enviar o formulário
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Impede o envio padrão
            login(); // Chama a função de login
        });
    </script>

   
</body>
</html>
