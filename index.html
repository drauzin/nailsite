<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem vinda a Layla Nail Design</title>
    <link rel="stylesheet" href="/css/style-login.css">
</head>
<body>

    <h1 style="text-align: center; margin-top: 20px;">Seja bem vinda!</h1>

    <div id="loginContainer">
        <!-- Formulário de Login -->
        <form id="loginForm">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <button type="submit">Entrar</button>
        </form>
        
        <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();
    
            const cpf = document.getElementById('cpf').value.trim();
            const senha = document.getElementById('senha').value;
    
            if (!cpf || !senha) {
                alert('Por favor, preencha CPF e senha.');
                return;
            }
    
            try {
                const response = await fetch('https://nailsite.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cpf, senha })
                });
    
                if (!response.ok) {
                    throw new Error('CPF ou senha inválidos.');
                }
    
                const usuario = await response.json();
    
                if (!usuario || !usuario.tipo) {
                    alert('Erro: resposta inesperada do servidor.');
                    return;
                }
    
                if (usuario.tipo === 'admin') {
                    sessionStorage.setItem('adminId', usuario.id);
                    window.location.href = 'painel.html';
                } else if (usuario.tipo === 'cliente') {
                    localStorage.setItem('usuarioLogado', JSON.stringify(usuario));
                    window.location.href = 'servicos.html';
                } else {
                    alert('Tipo de usuário desconhecido.');
                }
    
            } catch (error) {
                console.error('Erro ao fazer login:', error);
                alert('Erro ao fazer login. Verifique seu CPF e senha.');
            }
        });
    </script>
    
</body>
</html>
